name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build app and engine
        run: swift build -c release
      - name: Run physics tests
        # Release build: the 3D solver tests run 10-50x faster than in debug.
        run: swift test -c release -Xswiftc -enable-testing

  app-and-screenshots:
    runs-on: macos-15
    needs: build-and-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Fluid MechLab.app
        run: scripts/build-app.sh
      - name: Render screenshots of every screen
        run: |
          mkdir -p build/screenshots
          FMLAB_SNAPSHOT_DIR="$PWD/build/screenshots" \
          FMLAB_SNAPSHOT_PRESET="Deepwater Turbidite Sandstone" \
            "build/Fluid MechLab.app/Contents/MacOS/FluidMechLab" &
          APP_PID=$!
          # Give the app up to 5 minutes, then stop it.
          for i in $(seq 1 300); do
            if ! kill -0 $APP_PID 2>/dev/null; then break; fi
            if [ "$i" = 40 ]; then screencapture -x build/screenshots/full-screen.png || true; fi
            sleep 1
          done
          kill $APP_PID 2>/dev/null || true
          ls -la build/screenshots
      - name: Zip app
        run: ditto -c -k --keepParent "build/Fluid MechLab.app" "build/FluidMechLab.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: FluidMechLab-app
          path: build/FluidMechLab.zip
      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd build/screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${{ github.event.pull_request.head.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
